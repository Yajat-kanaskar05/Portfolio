<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yajat Kanaskar | Full-Stack Developer</title>
<meta name="description" content="Full-stack developer building web apps from interface to database.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="term">
  <header class="bar">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="title">visitor@yajat: ~</span>
    <button type="button" id="skip" class="skip">Skip intro</button>
  </header>

  <div id="screen" class="screen" role="log" aria-live="polite">
    <div id="out"></div>
    <form id="prompt" class="prompt" autocomplete="off" hidden>
      <label for="cmd" class="ps1">visitor@yajat:~$</label>
      <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="Type a command">
    </form>
  </div>

  <div id="dock" class="dock" hidden>
    <nav id="chips" class="chips" aria-label="Quick commands"></nav>
  </div>
</main>

<div id="project-overlay" class="project-overlay" hidden aria-hidden="true"></div>

<div id="win" class="win" role="dialog" aria-labelledby="win-title" tabindex="-1" hidden>
  <div id="win-bar" class="win-bar">
    <span id="win-title"></span>
    <button type="button" id="win-close" aria-label="Close project window">&times;</button>
  </div>
  <div id="win-body" class="win-body"></div>
</div>

<noscript>
  <p style="padding:2rem;font-family:monospace">
    Yajat Kanaskar, Full-Stack Developer. This site needs JavaScript.
    GitHub: github.com/Yajat-kanaskar05 | Email: yajat.important@gmail.com
  </p>
</noscript>

<script src="data.js"></script>
<script src="terminal.js"></script>
</body>
</html>
